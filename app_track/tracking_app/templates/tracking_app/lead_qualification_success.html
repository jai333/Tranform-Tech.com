<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform.io | Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #fafafc;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .success-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            padding: 60px 40px;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }
        .success-icon {
            font-size: 5rem;
            color: #4CAF50;
            margin-bottom: 20px;
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }
        .btn-home {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin-top: 30px;
            transition: all 0.2s;
        }
        .btn-home:hover {
            background: #357abd;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(74, 144, 226, 0.2);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="success-card">
        <i class="fas fa-check-circle success-icon"></i>
        <h2 class="fw-bold mb-3">You're All Set!</h2>
        <p class="text-muted fs-5 mb-0">Thanks for your interest. Our AI sales assistant will process your request and we'll be in touch shortly.</p>
        
        <a href="{% url 'home' %}" class="btn-home">Return to Home</a>
    </div>
</div>

</body>
</html>
