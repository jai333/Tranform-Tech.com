{% extends "tracking_app/base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0" style="border-radius: 16px;">
                <div class="card-header bg-primary text-white" style="border-radius: 16px 16px 0 0;">
                    <h4 class="mb-0 py-2"><i class="fas fa-calendar-alt me-2"></i>Create Scheduled Report</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Report Name</label>
                            <input type="text" name="name" class="form-control" required placeholder="e.g. Weekly Pipeline Update">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Report Type</label>
                            <select name="report_type" class="form-select" required>
                                {% for val, label in report_types %}
                                <option value="{{ val }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Frequency</label>
                            <select name="frequency" class="form-select" required>
                                {% for val, label in frequency_choices %}
                                <option value="{{ val }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Recipients (comma-separated emails)</label>
                            <textarea name="recipients" class="form-control" rows="3" required placeholder="ceo@company.com, vp_sales@company.com"></textarea>
                        </div>
                        <div class="mb-4 form-check form-switch">
                            <input type="checkbox" name="is_active" class="form-check-input" id="isActive" checked>
                            <label class="form-check-label fw-bold" for="isActive">Is Active</label>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg" style="border-radius: 8px;">
                                Create Schedule
                            </button>
                            <a href="{% url 'scheduled-report-list' %}" class="btn btn-light" style="border-radius: 8px;">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
