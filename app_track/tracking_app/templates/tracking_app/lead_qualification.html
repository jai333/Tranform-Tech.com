<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform.io | See If You Qualify</title>
    <!-- Use similar styling to base.html if any, but clean and independent -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #fafafc;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .wizard-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            padding: 50px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }
        .step {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .step.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-control, .form-select {
            border-radius: 12px;
            padding: 14px 20px;
            border: 2px solid #eef0f5;
            background: #fcfcfd;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.1);
            background: white;
        }
        .btn-next, .btn-submit {
            border-radius: 12px;
            padding: 14px 30px;
            font-weight: 600;
            font-size: 1.1rem;
            background: #4a90e2;
            border: none;
            color: white;
            transition: all 0.2s;
        }
        .btn-next:hover, .btn-submit:hover {
            background: #357abd;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(74, 144, 226, 0.2);
        }
        .btn-prev {
            background: transparent;
            border: none;
            color: #8898aa;
            font-weight: 500;
            padding: 14px 20px;
        }
        .btn-prev:hover {
            color: #333;
        }
        .progress-bar-custom {
            height: 6px;
            background: #eef0f5;
            border-radius: 10px;
            margin-bottom: 40px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #4a90e2;
            width: 0%;
            transition: width 0.4s ease;
        }
        .checkbox-card {
            border: 2px solid #eef0f5;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        .checkbox-card:hover {
            border-color: #b3d4f5;
            background: #f8fbff;
        }
        .checkbox-card input:checked + .checkbox-card {
            border-color: #4a90e2;
            background: #f0f7ff;
        }
        .form-check-input {
            margin-right: 15px;
            width: 1.2em;
            height: 1.2em;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 style="font-weight: 800; letter-spacing: -1px; color: #1a1a1a;">Transform.io</h1>
        <p class="text-muted fs-5">Let's see if we're a good fit.</p>
    </div>

    <div class="wizard-container">
        <div class="progress-bar-custom">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <form method="POST" action="{% url 'lead-qualification-form' %}" id="qualForm">
            {% csrf_token %}
            
            <!-- Step 1 -->
            <div class="step active" id="step1">
                <h3 class="mb-4 fw-bold">Basic Information</h3>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Your Name</label>
                    <input type="text" name="contact_name" class="form-control" required placeholder="John Doe">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Work Email</label>
                    <input type="email" name="email" class="form-control" required placeholder="john@company.com">
                </div>
                <div class="text-end mt-5">
                    <button type="button" class="btn-next" onclick="nextStep(1)">Continue <i class="fas fa-arrow-right ms-2"></i></button>
                </div>
            </div>

            <!-- Step 2 -->
            <div class="step" id="step2">
                <h3 class="mb-4 fw-bold">Company Details</h3>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Company Name</label>
                    <input type="text" name="company_name" class="form-control" placeholder="Acme Corp">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Company Size</label>
                    <select name="company_size" class="form-select">
                        <option value="">Select size</option>
                        <option value="10">1-10 employees</option>
                        <option value="50">11-50 employees</option>
                        <option value="200">51-200 employees</option>
                        <option value="500">201-500 employees</option>
                        <option value="1000">500+ employees</option>
                    </select>
                </div>
                <div class="d-flex justify-content-between mt-5">
                    <button type="button" class="btn-prev" onclick="prevStep(2)"><i class="fas fa-arrow-left me-2"></i> Back</button>
                    <button type="button" class="btn-next" onclick="nextStep(2)">Continue <i class="fas fa-arrow-right ms-2"></i></button>
                </div>
            </div>

            <!-- Step 3 -->
            <div class="step" id="step3">
                <h3 class="mb-4 fw-bold">Tech Stack & Budget</h3>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Current ATS/CRM Tool (if any)</label>
                    <input type="text" name="current_tool" class="form-control" placeholder="e.g. Bullhorn, Greenhouse">
                </div>
                
                <label class="form-label fw-semibold mt-2 mb-3">Main Pain Points</label>
                
                <label class="checkbox-card w-100">
                    <input class="form-check-input" type="checkbox" name="pain_points" value="too_slow">
                    <span>Current system is too slow/clunky</span>
                </label>
                <label class="checkbox-card w-100">
                    <input class="form-check-input" type="checkbox" name="pain_points" value="no_ai">
                    <span>Lack of automation/AI capabilities</span>
                </label>
                <label class="checkbox-card w-100">
                    <input class="form-check-input" type="checkbox" name="pain_points" value="bad_ui">
                    <span>Poor user experience for recruiters</span>
                </label>

                <div class="mb-4 mt-4">
                    <label class="form-label fw-semibold">Expected Budget Timeline</label>
                    <select name="budget" class="form-select">
                        <option value="">Select option</option>
                        <option value="high">Ready to buy (Q1)</option>
                        <option value="medium">Researching (Q2-Q3)</option>
                        <option value="low">Just looking</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between mt-5">
                    <button type="button" class="btn-prev" onclick="prevStep(3)"><i class="fas fa-arrow-left me-2"></i> Back</button>
                    <button type="submit" class="btn-submit">Submit Request <i class="fas fa-check ms-2"></i></button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    function updateProgress(step) {
        const totalSteps = 3;
        const progress = ((step - 1) / (totalSteps - 1)) * 100;
        document.getElementById('progressFill').style.width = `${progress}%`;
    }

    function nextStep(current) {
        // Basic validation for Step 1
        if (current === 1) {
            const name = document.querySelector('input[name="contact_name"]').value;
            const email = document.querySelector('input[name="email"]').value;
            if (!name || !email) {
                alert("Please fill out your name and email.");
                return;
            }
        }
        document.getElementById(`step${current}`).classList.remove('active');
        document.getElementById(`step${current + 1}`).classList.add('active');
        updateProgress(current + 1);
    }

    function prevStep(current) {
        document.getElementById(`step${current}`).classList.remove('active');
        document.getElementById(`step${current - 1}`).classList.add('active');
        updateProgress(current - 1);
    }
    
    // Initial progress
    updateProgress(1);
</script>

</body>
</html>
