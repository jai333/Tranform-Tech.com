{% extends 'tracking_app/base_public.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Delete Vendor</h2>
    <p>Are you sure you want to delete the vendor "{{ vendor.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'it-vendor-detail' vendor.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
