{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Free Demo — Transform.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'tracking_app/transform.css' %}?v=334">
    <!-- ▸ Apply saved theme before render to avoid flash of wrong theme -->
    <script>
        (function(){
            var t = localStorage.getItem('theme');
            if(t === 'light') document.documentElement.classList.add('light-theme');
        })();
    </script>
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 60px 24px; }
        .demo-wrap { max-width: 540px; width: 100%; }
        .demo-card { background: var(--bg-elevated); border: 1px solid var(--secondary); border-radius: 20px; padding: 48px; position: relative; overflow: hidden; }
        .demo-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--primary), #8b5cf6); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dark-gray); margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; background: var(--bg-surface); border: 1px solid var(--secondary); border-radius: 10px; color: white; padding: 12px 16px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; font-family: inherit; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,229,255,0.08); }
        .submit-btn { width: 100%; padding: 16px; background: var(--primary); color: #000; border: none; border-radius: 12px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: 12px; transition: all 0.3s; letter-spacing: -0.5px; }
        .submit-btn:hover { background: #00c4d8; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,229,255,0.3); }
        .trust-row { display: flex; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
        .trust-item { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-gray); }
        .trust-item i { color: var(--accent-green); }
    </style>
</head>
<body>

<div class="demo-wrap">
    <div style="text-align:center;margin-bottom:32px;">
        <div style="font-family:var(--font-mono);font-size:0.75rem;color:var(--primary);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;">Free · 15 Minutes · No Pressure</div>
        <h1 style="font-size:2rem;font-weight:800;color:white;line-height:1.1;margin-bottom:12px;">See Transform.io in action</h1>
        <p style="color:var(--text-gray);">Tell us about your team and we'll show you exactly how Transform.io solves your recruiting challenges.</p>
    </div>

    <div class="demo-card">
        <form method="post">
            {% csrf_token %}
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                <div class="form-group">
                    <label>Your Name *</label>
                    <input type="text" name="name" required placeholder="Jane Smith">
                </div>
                <div class="form-group">
                    <label>Work Email *</label>
                    <input type="email" name="email" required placeholder="jane@company.com">
                </div>
            </div>
            <div class="form-group">
                <label>Company *</label>
                <input type="text" name="company" required placeholder="Acme Recruiting LLC">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                <div class="form-group">
                    <label>Recruiter team size</label>
                    <select name="team_size">
                        <option value="">Select...</option>
                        <option value="1">Just me</option>
                        <option value="3">2–5 people</option>
                        <option value="10">6–15 people</option>
                        <option value="30">16–50 people</option>
                        <option value="100">50+ people</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Current ATS (if any)</label>
                    <input type="text" name="current_ats" placeholder="e.g. Greenhouse, none">
                </div>
            </div>
            <div class="form-group">
                <label>Your #1 recruiting challenge</label>
                <textarea name="pain_point" rows="3" placeholder="e.g. Tracking candidates across multiple jobs is a mess..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Book My Free Demo →</button>
        </form>

        <div class="trust-row">
            <div class="trust-item"><i class='bx bx-check-circle'></i> No credit card needed</div>
            <div class="trust-item"><i class='bx bx-check-circle'></i> 15-min focused demo</div>
            <div class="trust-item"><i class='bx bx-check-circle'></i> Cancel anytime</div>
        </div>
    </div>
</div>

<script src="{% static 'tracking_app/transform.js' %}"></script>
</body>
</html>
