{% extends 'tracking_app/base_public.html' %}
{% block content %}
<div class="container mt-5">
    <h2>IT Vendors</h2>
    <a href="{% url 'it-vendor-create' %}" class="btn btn-primary mb-3">Add Vendor</a>
    <table class="table table-dark table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Contact</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for vendor in vendors %}
            <tr>
                <td><a href="{% url 'it-vendor-detail' vendor.pk %}">{{ vendor.name }}</a></td>
                <td>{{ vendor.support_phone }}</td>
                <td>{{ vendor.contact_email }}</td>
                <td>
                    <a href="{% url 'it-vendor-update' vendor.pk %}" class="btn btn-sm btn-info">Edit</a>
                    <a href="{% url 'it-vendor-delete' vendor.pk %}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
