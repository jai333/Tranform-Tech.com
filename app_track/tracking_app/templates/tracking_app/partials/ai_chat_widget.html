{% load static %}
<!-- ═══════════════════════════════════════════════════════════════
     TRANSFORM-TECH AI ASSISTANT — Powered by Google Gemini
     Include in base.html and base_public.html before </body>
═══════════════════════════════════════════════════════════════ -->
<style>
#tt-chat-fab {
    position: fixed; bottom: 28px; right: 28px; width: 58px; height: 58px;
    border-radius: 50%; background: linear-gradient(135deg,#00E5FF,#0A84FF);
    border: none; cursor: pointer; z-index: 9999; box-shadow: 0 4px 24px rgba(0,229,255,0.45);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s; animation: tt-pulse 2.5s ease-in-out infinite;
}
#tt-chat-fab:hover { transform: scale(1.1); box-shadow: 0 6px 32px rgba(0,229,255,0.65); }
#tt-chat-fab svg { width: 26px; height: 26px; fill: #000; }
@keyframes tt-pulse {
    0%,100% { box-shadow: 0 4px 24px rgba(0,229,255,0.45); }
    50%      { box-shadow: 0 4px 36px rgba(0,229,255,0.75); }
}
#tt-chat-panel {
    position: fixed; bottom: 100px; right: 28px; width: 380px; max-height: 560px;
    background: #0a0a0a; border: 1px solid rgba(0,229,255,0.25); border-radius: 20px;
    display: flex; flex-direction: column; z-index: 9998;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,229,255,0.1);
    transform: translateY(20px) scale(0.95); opacity: 0; pointer-events: none;
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1); backdrop-filter: blur(20px);
}
#tt-chat-panel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: all; }
#tt-chat-header {
    padding: 14px 18px; border-bottom: 1px solid rgba(0,229,255,0.12);
    display: flex; align-items: center; gap: 10px; border-radius: 20px 20px 0 0;
    background: rgba(0,229,255,0.04); flex-shrink: 0;
}
.tt-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#00E5FF,#0A84FF); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.tt-header-info { flex: 1; }
.tt-header-name { font-weight: 700; font-size: 0.88rem; color: #fff; }
.tt-header-sub { font-size: 0.72rem; color: #00E5FF; display:flex; align-items:center; gap:4px; }
.tt-live-dot { width:6px; height:6px; border-radius:50%; background:#34C759; display:inline-block; animation:tt-pulse 1.5s ease-in-out infinite; }
#tt-chat-close { background:none; border:none; color:rgba(255,255,255,0.4); cursor:pointer; font-size:1.2rem; padding:4px; line-height:1; }
#tt-chat-close:hover { color:#fff; }
#tt-chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; min-height:280px; max-height:360px; scrollbar-width:thin; scrollbar-color:rgba(0,229,255,0.2) transparent; }
#tt-chat-messages::-webkit-scrollbar { width:4px; }
#tt-chat-messages::-webkit-scrollbar-thumb { background:rgba(0,229,255,0.2); border-radius:4px; }
.tt-msg { display:flex; gap:8px; align-items:flex-end; animation:tt-fadeup 0.3s ease; }
@keyframes tt-fadeup { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.tt-msg.user { flex-direction:row-reverse; }
.tt-msg-avatar { width:26px; height:26px; border-radius:50%; flex-shrink:0; }
.tt-msg-avatar.bot { background:linear-gradient(135deg,#00E5FF,#0A84FF); display:flex; align-items:center; justify-content:center; font-size:12px; }
.tt-msg-avatar.user-av { background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff; font-weight:700; }
.tt-bubble { max-width:82%; padding:10px 14px; border-radius:16px; font-size:0.83rem; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
.tt-msg.bot .tt-bubble { background:rgba(255,255,255,0.06); border:1px solid rgba(0,229,255,0.12); color:rgba(255,255,255,0.9); border-bottom-left-radius:4px; }
.tt-msg.user .tt-bubble { background:linear-gradient(135deg,rgba(0,229,255,0.2),rgba(10,132,255,0.2)); border:1px solid rgba(0,229,255,0.25); color:#fff; border-bottom-right-radius:4px; }
.tt-typing { display:flex; gap:4px; align-items:center; padding:12px 14px; }
.tt-typing span { width:6px; height:6px; background:#00E5FF; border-radius:50%; animation:tt-bounce 1.2s ease-in-out infinite; }
.tt-typing span:nth-child(2) { animation-delay:0.2s; }
.tt-typing span:nth-child(3) { animation-delay:0.4s; }
@keyframes tt-bounce { 0%,80%,100%{transform:scale(0.6);opacity:0.4} 40%{transform:scale(1);opacity:1} }
.tt-suggestions { display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 12px; }
.tt-chip { font-size:0.72rem; padding:5px 10px; border-radius:20px; border:1px solid rgba(0,229,255,0.25); background:rgba(0,229,255,0.06); color:#00E5FF; cursor:pointer; transition:all 0.15s; }
.tt-chip:hover { background:rgba(0,229,255,0.15); border-color:#00E5FF; }
#tt-chat-input-row { padding:12px 14px; border-top:1px solid rgba(0,229,255,0.1); display:flex; gap:8px; align-items:center; flex-shrink:0; border-radius:0 0 20px 20px; background:rgba(0,0,0,0.4); }
#tt-chat-input { flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:24px; padding:9px 16px; color:#fff; font-size:0.83rem; outline:none; resize:none; min-height:36px; max-height:80px; transition:border 0.2s; }
#tt-chat-input:focus { border-color:rgba(0,229,255,0.4); }
#tt-chat-input::placeholder { color:rgba(255,255,255,0.3); }
#tt-chat-send { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#00E5FF,#0A84FF); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform 0.15s,opacity 0.15s; }
#tt-chat-send:hover { transform:scale(1.08); }
#tt-chat-send:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
#tt-chat-send svg { width:16px; height:16px; fill:#000; }
@media(max-width:480px){ #tt-chat-panel{width:calc(100vw - 24px);right:12px;bottom:88px;} }
</style>

<button id="tt-chat-fab" onclick="ttToggleChat()" title="Ask AI Assistant">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.03 2 11c0 2.87 1.37 5.43 3.53 7.15L4 22l4.3-1.53A10.5 10.5 0 0 0 12 21c5.52 0 10-4.03 10-9s-4.48-9-10-9zm1 13H7v-2h6v2zm2-4H7V9h8v2z"/></svg>
</button>

<div id="tt-chat-panel">
    <div id="tt-chat-header">
        <div class="tt-avatar">🤖</div>
        <div class="tt-header-info">
            <div class="tt-header-name">Transform-Tech AI</div>
            <div class="tt-header-sub"><span class="tt-live-dot"></span> Powered by Google Gemini</div>
        </div>
        <button id="tt-chat-close" onclick="ttToggleChat()">✕</button>
    </div>
    <div id="tt-chat-messages"></div>
    <div class="tt-suggestions" id="tt-suggestions">
        <button class="tt-chip" onclick="ttSendSuggestion(this)">📊 What features do you have?</button>
        <button class="tt-chip" onclick="ttSendSuggestion(this)">💰 Pricing plans</button>
        <button class="tt-chip" onclick="ttSendSuggestion(this)">🤖 How does AI Sales work?</button>
        <button class="tt-chip" onclick="ttSendSuggestion(this)">🔧 Custom development</button>
    </div>
    <div id="tt-chat-input-row">
        <textarea id="tt-chat-input" placeholder="Ask anything about Transform-Tech..." rows="1"></textarea>
        <button id="tt-chat-send" onclick="ttSend()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
</div>

<script>
(function(){
'use strict';
var ttOpen=false, ttHistory=[], ttTyping=false;
var panel=document.getElementById('tt-chat-panel');
var messages=document.getElementById('tt-chat-messages');
var inp=document.getElementById('tt-chat-input');
var sendBtn=document.getElementById('tt-chat-send');
var suggs=document.getElementById('tt-suggestions');

window.ttToggleChat=function(){
    ttOpen=!ttOpen;
    panel.classList.toggle('open',ttOpen);
    if(ttOpen&&ttHistory.length===0){addBotMessage("👋 Hey! I'm the **Transform-Tech AI Assistant**, powered by Google Gemini.\n\nI can guide you through every feature, help troubleshoot issues, or answer anything about the platform.\n\nWhat can I help you with today?"); setTimeout(function(){inp.focus();},300);}
};
window.ttSend=async function(){
    var text=inp.value.trim();
    if(!text||ttTyping)return;
    inp.value=''; inp.style.height='auto';
    addUserMessage(text);
    await ttFetch(text);
};
window.ttSendSuggestion=function(btn){inp.value=btn.textContent.trim();ttSend();};

function addBotMessage(text){
    var d=document.createElement('div'); d.className='tt-msg bot';
    d.innerHTML='<div class="tt-msg-avatar bot">🤖</div><div class="tt-bubble">'+fmt(text)+'</div>';
    messages.appendChild(d); scroll();
    ttHistory.push({role:'model',parts:[{text:text}]});
}
function addUserMessage(text){
    if(suggs)suggs.style.display='none';
    var d=document.createElement('div'); d.className='tt-msg user';
    d.innerHTML='<div class="tt-bubble">'+esc(text)+'</div><div class="tt-msg-avatar user-av">You</div>';
    messages.appendChild(d); scroll();
    ttHistory.push({role:'user',parts:[{text:text}]});
}
function showTyping(){
    var d=document.createElement('div'); d.className='tt-msg bot'; d.id='tt-typing';
    d.innerHTML='<div class="tt-msg-avatar bot">🤖</div><div class="tt-bubble tt-typing"><span></span><span></span><span></span></div>';
    messages.appendChild(d); scroll();
}
function removeTyping(){var e=document.getElementById('tt-typing');if(e)e.remove();}
function scroll(){setTimeout(function(){messages.scrollTop=messages.scrollHeight;},50);}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(t){return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');}
function csrf(){var c=document.cookie.split(';').find(function(x){return x.trim().startsWith('csrftoken=');});return c?c.split('=')[1]:'';}

async function ttFetch(userText){
    ttTyping=true; sendBtn.disabled=true; showTyping();
    try{
        var res=await fetch('/api/ai-chat/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({message:userText,history:ttHistory.slice(-12)})});
        removeTyping();
        if(!res.ok){addBotMessage('\u26a0\ufe0f I am having trouble connecting. Please try again.');return;}
        var data=await res.json();
        addBotMessage(data.reply||(data.error?'\u26a0\ufe0f '+data.error:'\u26a0\ufe0f Something went wrong.'));
    }catch(e){removeTyping();addBotMessage('\u26a0\ufe0f Connection error. Please check your internet.');}
    finally{ttTyping=false;sendBtn.disabled=false;}
}
inp.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px';});
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ttSend();}});
})();
</script>
