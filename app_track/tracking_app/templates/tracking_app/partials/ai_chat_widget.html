{% load static %}
<!-- ═══════════════════════════ TRANSFORM-TECH AI ASSISTANT ═══════════════════════════ -->
<style>
/* ─── FAB Button ─────────────────────────────────────────────────────────── */
#tt-fab {
    position:fixed; bottom:28px; right:28px; z-index:10000;
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,#00E5FF 0%,#0A84FF 100%);
    box-shadow:0 0 0 0 rgba(0,229,255,0.5);
    display:flex; align-items:center; justify-content:center;
    animation:tt-halo 2.8s ease-in-out infinite;
    transition:transform .2s, box-shadow .2s;
}
#tt-fab:hover { transform:scale(1.12); box-shadow:0 8px 32px rgba(0,229,255,.6); }
#tt-fab svg { width:24px; height:24px; fill:#000; transition:transform .3s; }
#tt-fab.open svg { transform:rotate(45deg); }
@keyframes tt-halo {
    0%,100% { box-shadow:0 0 0 0 rgba(0,229,255,.5),0 4px 20px rgba(0,229,255,.35); }
    50%      { box-shadow:0 0 0 10px rgba(0,229,255,0),0 4px 28px rgba(0,229,255,.5); }
}

/* ─── Unread badge ───────────────────────────────────────────────────────── */
#tt-badge {
    position:absolute; top:-3px; right:-3px; width:18px; height:18px;
    border-radius:50%; background:#FF3B30; color:#fff;
    font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;
    border:2px solid #000; animation:tt-pop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes tt-pop { from{transform:scale(0)} to{transform:scale(1)} }

/* ─── Panel ──────────────────────────────────────────────────────────────── */
#tt-panel {
    position:fixed; bottom:96px; right:28px; z-index:9999;
    width:384px; max-height:600px;
    display:flex; flex-direction:column;
    background:rgba(8,8,12,0.92);
    border:1px solid rgba(0,229,255,0.18);
    border-radius:24px;
    box-shadow:0 32px 80px rgba(0,0,0,.8), 0 0 0 1px rgba(0,229,255,.08), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(28px) saturate(1.6);
    -webkit-backdrop-filter:blur(28px) saturate(1.6);
    transform:translateY(16px) scale(0.96);
    opacity:0; pointer-events:none;
    transition:all .28s cubic-bezier(.34,1.46,.64,1);
    overflow:hidden;
}
#tt-panel.open { transform:translateY(0) scale(1); opacity:1; pointer-events:all; }

/* ─── Gradient top accent line ───────────────────────────────────────────── */
#tt-panel::before {
    content:'';
    position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg,transparent,#00E5FF,#0A84FF,transparent);
    border-radius:24px 24px 0 0;
}

/* ─── Header ─────────────────────────────────────────────────────────────── */
#tt-header {
    display:flex; align-items:center; gap:12px;
    padding:16px 18px 14px;
    border-bottom:1px solid rgba(255,255,255,.06);
    flex-shrink:0;
}
.tt-logo {
    position:relative; width:42px; height:42px; flex-shrink:0;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #0d1a2e, #020c1a);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1.5px rgba(0,229,255,.4), 0 4px 20px rgba(0,229,255,.25);
}
.tt-logo::after {
    content:''; position:absolute; bottom:-1px; right:-1px;
    width:11px; height:11px; border-radius:50%;
    background:#34C759; border:2px solid #08080c;
    box-shadow:0 0 6px rgba(52,199,89,.6);
}
.tt-logo-svg { width:26px; height:26px; }
@keyframes tt-orbit {
    from { transform:rotate(0deg); }
    to   { transform:rotate(360deg); }
}
.tt-orbit-ring { animation:tt-orbit 3s linear infinite; transform-origin:13px 13px; }
.tt-hinfo { flex:1; min-width:0; }
.tt-hname { font-weight:700; font-size:.9rem; color:#fff; letter-spacing:-.01em; }
.tt-hsub  { font-size:.7rem; color:#00E5FF; margin-top:1px; opacity:.85; }
#tt-close {
    width:30px; height:30px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.06); color:rgba(255,255,255,.5);
    display:flex; align-items:center; justify-content:center; font-size:14px;
    transition:background .15s, color .15s;
}
#tt-close:hover { background:rgba(255,59,48,.18); color:#FF3B30; }

/* ─── Messages ───────────────────────────────────────────────────────────── */
#tt-msgs {
    flex:1; overflow-y:auto; padding:16px 14px; display:flex;
    flex-direction:column; gap:10px;
    min-height:260px; max-height:400px;
    scrollbar-width:thin; scrollbar-color:rgba(0,229,255,.15) transparent;
}
#tt-msgs::-webkit-scrollbar { width:3px; }
#tt-msgs::-webkit-scrollbar-thumb { background:rgba(0,229,255,.2); border-radius:3px; }

.tt-row { display:flex; gap:8px; align-items:flex-end; animation:tt-up .25s ease; }
@keyframes tt-up { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
.tt-row.u { flex-direction:row-reverse; }

.tt-av {
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:13px;
}
.tt-av.bot { background:linear-gradient(135deg,#00E5FF,#0A84FF); box-shadow:0 2px 8px rgba(0,229,255,.3); }
.tt-av.usr { background:rgba(255,255,255,.1); font-size:10px; font-weight:700; color:#fff; }

.tt-bub {
    max-width:80%; padding:11px 14px; border-radius:18px;
    font-size:.83rem; line-height:1.58; word-break:break-word;
}
.tt-row.bot .tt-bub {
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.07);
    color:rgba(255,255,255,.88);
    border-bottom-left-radius:4px;
}
.tt-row.u .tt-bub {
    background:linear-gradient(135deg,rgba(0,229,255,.16),rgba(10,132,255,.16));
    border:1px solid rgba(0,229,255,.22);
    color:#fff;
    border-bottom-right-radius:4px;
}

/* ─── Typing dots ────────────────────────────────────────────────────────── */
.tt-dots { display:flex; gap:4px; padding:4px 2px; }
.tt-dots span {
    width:6px; height:6px; border-radius:50%; background:#00E5FF;
    animation:tt-dk 1.3s ease-in-out infinite;
}
.tt-dots span:nth-child(2){animation-delay:.22s}
.tt-dots span:nth-child(3){animation-delay:.44s}
@keyframes tt-dk { 0%,80%,100%{transform:scale(.55);opacity:.35} 40%{transform:scale(1);opacity:1} }

/* ─── Suggestion chips ───────────────────────────────────────────────────── */
#tt-chips { display:flex; flex-wrap:wrap; gap:6px; padding:4px 14px 10px; flex-shrink:0; }
.tt-chip {
    font-size:.71rem; padding:5px 11px; border-radius:20px; cursor:pointer;
    background:rgba(0,229,255,.07); border:1px solid rgba(0,229,255,.2);
    color:rgba(0,229,255,.9); transition:all .15s; white-space:nowrap;
    font-family:inherit;
}
.tt-chip:hover { background:rgba(0,229,255,.18); border-color:rgba(0,229,255,.5); color:#00E5FF; }

/* ─── Input row ──────────────────────────────────────────────────────────── */
#tt-foot {
    padding:12px 14px; border-top:1px solid rgba(255,255,255,.05);
    display:flex; gap:8px; align-items:flex-end; flex-shrink:0;
    background:rgba(0,0,0,.25);
}
#tt-inp {
    flex:1; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.09);
    border-radius:22px; padding:9px 16px;
    color:#fff; font-size:.83rem; resize:none;
    min-height:38px; max-height:90px; outline:none;
    font-family:inherit; transition:border .2s, box-shadow .2s;
    line-height:1.4;
}
#tt-inp:focus {
    border-color:rgba(0,229,255,.4);
    box-shadow:0 0 0 3px rgba(0,229,255,.07);
}
#tt-inp::placeholder { color:rgba(255,255,255,.25); }
#tt-send {
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
    background:linear-gradient(135deg,#00E5FF,#0A84FF);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 12px rgba(0,229,255,.35);
    transition:transform .15s, opacity .15s, box-shadow .15s;
}
#tt-send:hover { transform:scale(1.08); box-shadow:0 4px 18px rgba(0,229,255,.5); }
#tt-send:disabled { opacity:.45; cursor:not-allowed; transform:none; }
#tt-send svg { width:15px; height:15px; fill:#000; }

/* ─── Powered footer ─────────────────────────────────────────────────────── */
#tt-powered {
    text-align:center; font-size:.63rem; color:rgba(255,255,255,.2);
    padding:6px 0 10px; flex-shrink:0; letter-spacing:.03em;
}

@media(max-width:480px){
    #tt-panel{width:calc(100vw - 16px);right:8px;bottom:84px;}
}
</style>

<!-- FAB -->
<button id="tt-fab" onclick="ttToggle()" title="Transform-Tech AI Assistant" aria-label="Open AI Assistant">
    <span id="tt-badge" style="display:none">1</span>
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 3H5a2 2 0 0 0-2 2v14l4-4h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 11l-3-3H7v-2h2l3 3 5-5h2v2z"/>
    </svg>
</button>

<!-- Panel -->
<div id="tt-panel" role="dialog" aria-label="Transform-Tech AI Assistant">
    <!-- Header -->
    <div id="tt-header">
        <div class="tt-logo">
            <!-- Transform-Tech Atom Logo SVG -->
            <svg class="tt-logo-svg" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Nucleus -->
                <circle cx="13" cy="13" r="2.8" fill="#00E5FF" opacity="0.95"/>
                <circle cx="13" cy="13" r="1.4" fill="#fff"/>
                <!-- Orbit ring 1 (animated) -->
                <g class="tt-orbit-ring">
                    <ellipse cx="13" cy="13" rx="10" ry="3.8" stroke="#00E5FF" stroke-width="1.2" fill="none" opacity="0.7"/>
                    <circle cx="23" cy="13" r="1.3" fill="#00E5FF"/>
                </g>
                <!-- Orbit ring 2 (static, tilted) -->
                <ellipse cx="13" cy="13" rx="10" ry="3.8" stroke="#0A84FF" stroke-width="1" fill="none" opacity="0.45"
                    transform="rotate(60 13 13)"/>
                <!-- Orbit ring 3 (static, tilted other way) -->
                <ellipse cx="13" cy="13" rx="10" ry="3.8" stroke="#00E5FF" stroke-width="1" fill="none" opacity="0.3"
                    transform="rotate(-60 13 13)"/>
            </svg>
        </div>
        <div class="tt-hinfo">
            <div class="tt-hname">Transform-Tech AI</div>
            <div class="tt-hsub">⚡ Powered by Google Gemini</div>
        </div>
        <button id="tt-close" onclick="ttToggle()" title="Close" aria-label="Close chat">✕</button>
    </div>

    <!-- Messages -->
    <div id="tt-msgs" role="log" aria-live="polite"></div>

    <!-- Chips -->
    <div id="tt-chips">
        <button class="tt-chip" onclick="ttChip(this)">📊 Platform features</button>
        <button class="tt-chip" onclick="ttChip(this)">💰 View pricing</button>
        <button class="tt-chip" onclick="ttChip(this)">🤖 How AI Sales works</button>
        <button class="tt-chip" onclick="ttChip(this)">🔧 Custom dev services</button>
        <button class="tt-chip" onclick="ttChip(this)">📧 Configure email</button>
    </div>

    <!-- Input -->
    <div id="tt-foot">
        <textarea id="tt-inp" placeholder="Ask anything…" rows="1" aria-label="Chat input"></textarea>
        <button id="tt-send" onclick="ttSend()" aria-label="Send">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
    <div id="tt-powered">Transform-Tech.com · Gemini AI</div>
</div>

<script>
(function(){
'use strict';
var open=false,busy=false,hist=[],shown=false;
var fab=document.getElementById('tt-fab');
var panel=document.getElementById('tt-panel');
var msgs=document.getElementById('tt-msgs');
var inp=document.getElementById('tt-inp');
var btn=document.getElementById('tt-send');
var chips=document.getElementById('tt-chips');
var badge=document.getElementById('tt-badge');

// Show badge after 4s to draw attention
setTimeout(function(){badge.style.display='flex';},4000);

window.ttToggle=function(){
    open=!open;
    panel.classList.toggle('open',open);
    fab.classList.toggle('open',open);
    badge.style.display='none';
    if(open){
        if(!shown){shown=true;ttBot("👋 Hi! I'm **Transform-Tech AI**, your product guide powered by Google Gemini.\n\nI can answer anything about the platform, help you configure features, or guide you through the product.\n\nWhat can I help you with?");}
        setTimeout(function(){inp.focus();},200);
    }
};

window.ttChip=function(el){
    inp.value=el.textContent.trim();
    chips.style.display='none';
    ttSend();
};

window.ttSend=async function(){
    var t=inp.value.trim();
    if(!t||busy)return;
    inp.value='';inp.style.height='auto';
    ttUser(t);
    await ttFetch(t);
};

function ttUser(t){
    if(chips)chips.style.display='none';
    var d=mkRow('u');
    d.innerHTML='<div class="tt-bub">'+esc(t)+'</div><div class="tt-av usr">You</div>';
    msgs.appendChild(d);scroll();
    hist.push({role:'user',parts:[{text:t}]});
}

function ttBot(t){
    var d=mkRow('bot');
    d.innerHTML='<div class="tt-av bot" style="background:radial-gradient(circle at 35% 35%,#0d1a2e,#020c1a);box-shadow:0 0 0 1px rgba(0,229,255,.35);">'
        +'<svg width="16" height="16" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="2.8" fill="#00E5FF" opacity="0.95"/><circle cx="13" cy="13" r="1.4" fill="#fff"/><ellipse cx="13" cy="13" rx="10" ry="3.8" stroke="#00E5FF" stroke-width="1.2" fill="none" opacity="0.7"/><ellipse cx="13" cy="13" rx="10" ry="3.8" stroke="#0A84FF" stroke-width="1" fill="none" opacity="0.45" transform="rotate(60 13 13)"/><ellipse cx="13" cy="13" rx="10" ry="3.8" stroke="#00E5FF" stroke-width="1" fill="none" opacity="0.3" transform="rotate(-60 13 13)"/></svg>'
        +'</div><div class="tt-bub">'+fmt(t)+'</div>';
    msgs.appendChild(d);scroll();
    hist.push({role:'model',parts:[{text:t}]});
}

function mkRow(cls){var d=document.createElement('div');d.className='tt-row '+cls;return d;}

function ttTyping(){
    var d=mkRow('bot');d.id='tt-typing';
    d.innerHTML='<div class="tt-av bot" style="background:radial-gradient(circle at 35% 35%,#0d1a2e,#020c1a);box-shadow:0 0 0 1px rgba(0,229,255,.35);">'
        +'<svg width="16" height="16" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="2.8" fill="#00E5FF" opacity="0.95"/><circle cx="13" cy="13" r="1.4" fill="#fff"/><ellipse cx="13" cy="13" rx="10" ry="3.8" stroke="#00E5FF" stroke-width="1.2" fill="none" opacity="0.7"/><ellipse cx="13" cy="13" rx="10" ry="3.8" stroke="#0A84FF" stroke-width="1" fill="none" opacity="0.45" transform="rotate(60 13 13)"/></svg>'
        +'</div><div class="tt-bub"><div class="tt-dots"><span></span><span></span><span></span></div></div>';
    msgs.appendChild(d);scroll();
}

function rmTyping(){var e=document.getElementById('tt-typing');if(e)e.remove();}

async function ttFetch(msg){
    busy=true;btn.disabled=true;ttTyping();
    try{
        var r=await fetch('/api/ai-chat/',{
            method:'POST',
            headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},
            body:JSON.stringify({message:msg,history:hist.slice(-14)})
        });
        rmTyping();
        var d;
        try { d = await r.json(); } catch(e) {}
        
        if(!r.ok){
            ttBot('⚠️ ' + (d && d.error ? d.error : 'Service temporarily unavailable. Please try again.'));
            return;
        }
        ttBot(d.reply||(d&&d.error?'⚠️ '+d.error:'⚠️ Unexpected error.'));
    }catch(e){rmTyping();ttBot('⚠️ Connection error. Check your internet connection.');}
    finally{busy=false;btn.disabled=false;}
}

function scroll(){setTimeout(function(){msgs.scrollTop=msgs.scrollHeight;},40);}
function csrf(){var c=document.cookie.split(';').find(function(x){return x.trim().startsWith('csrftoken=');});return c?c.trim().split('=')[1]:'';}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(t){
    return t
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
        .replace(/`([^`]+)`/g,'<code style="background:rgba(0,229,255,.1);padding:1px 5px;border-radius:4px;font-size:.8em;">$1</code>')
        .replace(/^[-•] (.+)$/gm,'<div style="display:flex;gap:6px;margin:2px 0"><span style="color:#00E5FF;flex-shrink:0">▸</span><span>$1</span></div>')
        .replace(/\n/g,'<br>');
}

inp.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,90)+'px';});
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ttSend();}});
})();
</script>
